<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Danh sách khách xác nhận — Trinh Giang &amp; Hoàng Hạnh</title>
<style>
  :root {
    --ink: #4a2b2b;
    --rose: #c43b4a;
    --rose-soft: #f7e8ea;
    --line: #ecd9dc;
    --bg: #fbf5f3;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: "Segoe UI", system-ui, -apple-system, Arial, sans-serif;
    background: var(--bg);
    color: var(--ink);
    padding: 20px;
  }
  h1 {
    font-size: 22px;
    margin: 0 0 4px;
    color: var(--rose);
  }
  .sub { margin: 0 0 18px; font-size: 13px; color: #8a6b6b; }

  .stats {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    margin-bottom: 16px;
  }
  .stat {
    background: #fff;
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 10px 16px;
    min-width: 130px;
  }
  .stat .num { font-size: 22px; font-weight: 700; color: var(--rose); }
  .stat .lbl { font-size: 12px; color: #8a6b6b; }

  .toolbar {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    align-items: center;
    margin-bottom: 14px;
  }
  .filters { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip {
    border: 1px solid var(--line);
    background: #fff;
    color: var(--ink);
    padding: 7px 14px;
    border-radius: 999px;
    cursor: pointer;
    font-size: 13px;
  }
  .chip.active { background: var(--rose); border-color: var(--rose); color: #fff; }
  .spacer { flex: 1; }
  input[type="search"] {
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 8px 14px;
    font-size: 13px;
    min-width: 200px;
    outline: none;
  }
  .btn {
    border: none;
    background: var(--rose);
    color: #fff;
    padding: 9px 16px;
    border-radius: 999px;
    cursor: pointer;
    font-size: 13px;
    font-weight: 600;
  }
  .btn:active { transform: scale(0.98); }

  .table-wrap {
    background: #fff;
    border: 1px solid var(--line);
    border-radius: 12px;
    overflow: auto;
  }
  table { border-collapse: collapse; width: 100%; font-size: 14px; }
  th, td {
    text-align: left;
    padding: 11px 14px;
    border-bottom: 1px solid var(--line);
    vertical-align: top;
    white-space: nowrap;
  }
  th {
    background: var(--rose-soft);
    color: var(--rose);
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.03em;
    position: sticky;
    top: 0;
  }
  td.note { white-space: normal; min-width: 220px; color: #6b4a4a; }
  tr:last-child td { border-bottom: none; }
  .tag {
    display: inline-block;
    padding: 2px 10px;
    border-radius: 999px;
    font-size: 12px;
    font-weight: 600;
  }
  .tag.bride { background: #fde7ef; color: #c2185b; }
  .tag.groom { background: #e3f0fb; color: #1565c0; }
  .tag.yes { background: #e6f4ea; color: #1b8a3a; }
  .tag.no { background: #fdeaea; color: #c0392b; }
  .empty { padding: 30px; text-align: center; color: #8a6b6b; }
  .idx { color: #b39a9a; }
</style>
</head>
<body>
  <h1>Danh sách khách xác nhận</h1>
  <p class="sub">Trinh Giang &amp; Hoàng Hạnh — cập nhật trực tiếp từ Firebase.</p>

  <div class="stats" id="stats"></div>

  <div class="toolbar">
    <div class="filters" id="filters">
      <button class="chip active" data-filter="all">Tất cả</button>
      <button class="chip" data-filter="bride">Khách cô dâu</button>
      <button class="chip" data-filter="groom">Khách chú rể</button>
      <button class="chip" data-filter="yes">Sẽ đến</button>
      <button class="chip" data-filter="no">Không đến</button>
    </div>
    <span class="spacer"></span>
    <input type="search" id="search" placeholder="Tìm theo tên / lời nhắn..." />
    <button class="btn" id="export">Xuất Excel (CSV)</button>
  </div>

  <div class="table-wrap">
    <table id="table">
      <thead>
        <tr>
          <th>#</th>
          <th>Họ và tên</th>
          <th>Quan hệ</th>
          <th>Tham dự</th>
          <th>Số người</th>
          <th>Lời nhắn</th>
          <th>Thời gian gửi</th>
        </tr>
      </thead>
      <tbody id="tbody"></tbody>
    </table>
    <div class="empty" id="empty" hidden>Chưa có ai xác nhận.</div>
  </div>

<script src="https://www.gstatic.com/firebasejs/11.6.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/11.6.0/firebase-database-compat.js"></script>
<script>
  const firebaseConfig = {
    apiKey: "AIzaSyBe7fYgRshIowUQ8phoPh0nuUXeb47ZXug",
    authDomain: "damcuoigianghanh.firebaseapp.com",
    databaseURL:
      "https://damcuoigianghanh-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "damcuoigianghanh",
    storageBucket: "damcuoigianghanh.firebasestorage.app",
    messagingSenderId: "724957835833",
    appId: "1:724957835833:web:03d54b815314609af353e8",
  };
  firebase.initializeApp(firebaseConfig);
  const db = firebase.database();

  let rows = [];
  let filter = "all";
  let keyword = "";

  function fmtTime(ts) {
    if (!ts) return "";
    const d = new Date(ts);
    if (isNaN(d.getTime())) return "";
    const p = (n) => String(n).padStart(2, "0");
    return `${p(d.getDate())}/${p(d.getMonth() + 1)}/${d.getFullYear()} ${p(d.getHours())}:${p(d.getMinutes())}`;
  }

  function relationText(r) {
    return r === "groom" ? "Khách chú rể" : "Khách cô dâu";
  }
  function attendText(a) {
    return a === "yes" ? "Sẽ đến" : "Không đến";
  }

  function passFilter(r) {
    if (filter === "bride") return r.relation === "bride";
    if (filter === "groom") return r.relation === "groom";
    if (filter === "yes") return r.attend === "yes";
    if (filter === "no") return r.attend === "no";
    return true;
  }
  function passSearch(r) {
    if (!keyword) return true;
    const k = keyword.toLowerCase();
    return (
      (r.name || "").toLowerCase().includes(k) ||
      (r.note || "").toLowerCase().includes(k)
    );
  }

  function visibleRows() {
    return rows.filter((r) => passFilter(r) && passSearch(r));
  }

  function renderStats() {
    const total = rows.length;
    const bride = rows.filter((r) => r.relation === "bride").length;
    const groom = rows.filter((r) => r.relation === "groom").length;
    const yes = rows.filter((r) => r.attend === "yes").length;
    const guests = rows
      .filter((r) => r.attend === "yes")
      .reduce((s, r) => s + (Number(r.guests) || 0), 0);
    const cards = [
      { num: total, lbl: "Lượt phản hồi" },
      { num: yes, lbl: "Xác nhận đến" },
      { num: guests, lbl: "Tổng số khách dự" },
      { num: bride, lbl: "Khách cô dâu" },
      { num: groom, lbl: "Khách chú rể" },
    ];
    document.getElementById("stats").innerHTML = cards
      .map((c) => `<div class="stat"><div class="num">${c.num}</div><div class="lbl">${c.lbl}</div></div>`)
      .join("");
  }

  function esc(s) {
    return String(s == null ? "" : s)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;");
  }

  function renderTable() {
    const list = visibleRows();
    const tbody = document.getElementById("tbody");
    const empty = document.getElementById("empty");
    if (!list.length) {
      tbody.innerHTML = "";
      empty.hidden = false;
      return;
    }
    empty.hidden = true;
    tbody.innerHTML = list
      .map((r, i) => {
        const relCls = r.relation === "groom" ? "groom" : "bride";
        const attCls = r.attend === "yes" ? "yes" : "no";
        return (
          `<tr>` +
          `<td class="idx">${i + 1}</td>` +
          `<td>${esc(r.name)}</td>` +
          `<td><span class="tag ${relCls}">${relationText(r.relation)}</span></td>` +
          `<td><span class="tag ${attCls}">${attendText(r.attend)}</span></td>` +
          `<td>${r.attend === "yes" ? esc(r.guests || 1) : "—"}</td>` +
          `<td class="note">${esc(r.note) || "—"}</td>` +
          `<td>${fmtTime(r.createdAt)}</td>` +
          `</tr>`
        );
      })
      .join("");
  }

  function render() {
    renderStats();
    renderTable();
  }

  function exportCsv() {
    const list = visibleRows();
    const header = ["STT", "Họ và tên", "Quan hệ", "Tham dự", "Số người", "Lời nhắn", "Thời gian gửi"];
    const cell = (v) => {
      const s = String(v == null ? "" : v).replace(/"/g, '""');
      return `"${s}"`;
    };
    const lines = [header.map(cell).join(",")];
    list.forEach((r, i) => {
      lines.push(
        [
          i + 1,
          r.name || "",
          relationText(r.relation),
          attendText(r.attend),
          r.attend === "yes" ? r.guests || 1 : "",
          r.note || "",
          fmtTime(r.createdAt),
        ]
          .map(cell)
          .join(",")
      );
    });
    // BOM để Excel hiển thị đúng tiếng Việt
    const blob = new Blob(["\uFEFF" + lines.join("\r\n")], {
      type: "text/csv;charset=utf-8;",
    });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = `danh-sach-khach-${new Date().toISOString().slice(0, 10)}.csv`;
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
  }

  document.getElementById("filters").addEventListener("click", (e) => {
    const btn = e.target.closest(".chip");
    if (!btn) return;
    filter = btn.dataset.filter;
    document.querySelectorAll(".chip").forEach((c) => c.classList.toggle("active", c === btn));
    renderTable();
  });
  document.getElementById("search").addEventListener("input", (e) => {
    keyword = e.target.value.trim();
    renderTable();
  });
  document.getElementById("export").addEventListener("click", exportCsv);

  db.ref("rsvp")
    .orderByChild("createdAt")
    .on(
      "value",
      (snap) => {
        rows = [];
        snap.forEach((child) => {
          const v = child.val() || {};
          rows.push({
            id: child.key,
            name: v.name || "",
            relation: v.relation || "bride",
            attend: v.attend || "no",
            guests: v.guests || 0,
            note: v.note || "",
            createdAt: v.createdAt || 0,
          });
        });
        rows.reverse();
        render();
      },
      (err) => {
        document.getElementById("empty").hidden = false;
        document.getElementById("empty").textContent =
          "Không đọc được dữ liệu. Kiểm tra Rules Firebase (cho phép read).";
        console.warn(err);
      }
    );
</script>
</body>
</html>
